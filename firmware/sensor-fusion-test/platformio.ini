; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = T-Stick

[common]
lib_deps = 
    https://github.com/aburt2/IMU_Sensor_Fusion#pr-add-support-for-floats
	https://github.com/adafruit/Adafruit_MMC56x3.git
	ICM42670P
build_flags = 
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
	-DSENSOR_FUSION_FLOATS

; Dev Environment for the Tstick 5GW using the EnchantiS3 dev board and Enchanti Touch board
[env:enchantiS3-rev4]
platform = espressif32
board = enchantiS3
framework = arduino
board_build.partitions = min_spiffs_no_OTA.csv
build_flags = 
	-DTSTICK_SIZE=60
	-Dtstick_5gw_dev
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	${common.build_flags}
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = 
	esp32_exception_decoder
	send_on_enter 
lib_deps = 
	${common.lib_deps}
platform_packages =
	framework-arduinoespressif32 @ 3.20011.230801
	tool-esptoolpy @ 1.40501.0
	tool-mkfatfs @ 2.0.1